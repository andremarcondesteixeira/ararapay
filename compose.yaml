services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=ararapay_db'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=ararapay_user'
    ports:
      - '5432:5432'
  api:
    profiles:
      - full
    image: andremarcondesteixeira/ararapay-api
    build: api
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/ararapay_db"
      SPRING_DATASOURCE_USERNAME: "ararapay_user"
      SPRING_DATASOURCE_PASSWORD: "secret"
