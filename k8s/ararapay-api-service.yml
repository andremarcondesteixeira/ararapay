apiVersion: v1
kind: Service
metadata:
  name: "ararapay-api-service"
  labels:
    domain: "ararapay"
spec:
  selector:
    # selectors in services do not use matchLabels
    domain: "ararapay"
    type: "api"
  type: LoadBalancer
  ports:
    - name: "ararapay-api-http-port"
      port: 8080 # service port
      targetPort: 8080 # container port
      protocol: TCP
